<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Biométrica - CEMG Juan Lindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        @keyframes goldShimmer { 
            0% { background-position: -200% center; } 
            100% { background-position: 200% center; } 
        }
        .title-gold-glow { 
            background: linear-gradient(90deg, #ffffff 0%, #ffffff 35%, #fef08a 50%, #ffffff 65%, #ffffff 100%); 
            background-size: 200% auto; 
            color: transparent; 
            -webkit-background-clip: text; 
            background-clip: text; 
            animation: goldShimmer 4s infinite linear; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-4">

    <!-- ENCABEZADO -->
    <header class="text-center my-1">
        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold tracking-widest uppercase mb-1 shadow">
            ✨ Módulo Biométrico ✨
        </div>
        <h1 class="text-xl sm:text-2xl font-serif font-extrabold tracking-wider title-gold-glow">
            CAPTURA DE FOTOGRAFÍA CARNET
        </h1>
    </header>

    <!-- CONTENEDOR DE LA CÁMARA (AMPLIADO) -->
    <main class="w-full max-w-lg bg-slate-900/95 border border-blue-500/60 rounded-2xl p-4 shadow-2xl flex flex-col items-center relative">
        
        <!-- VISOR MÁS GRANDE (h-[440px] o h-[480px]) -->
        <div class="w-full h-[440px] sm:h-[480px] rounded-xl overflow-hidden bg-slate-950 border-2 border-amber-500/80 relative flex items-center justify-center shadow-inner">
            <!-- Video de la cámara -->
            <video id="videoCamara" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            
            <!-- Canvas oculto para procesar la foto -->
            <canvas id="canvasFoto" style="display:none;"></canvas>

            <!-- GUÍAS VISUALES SUPERPUESTAS -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <!-- Óvalo más grande y proporcionado para el rostro -->
                <div class="w-56 h-72 sm:w-64 sm:h-80 border-2 border-dashed border-amber-400/80 rounded-full shadow-[0_0_25px_rgba(245,158,11,0.25)] relative flex items-center justify-center">
                    <!-- Línea de referencia horizontal para los ojos -->
                    <div class="absolute w-full border-b border-cyan-400/60 border-dashed top-1/2 -translate-y-1/2 flex items-center justify-between px-2">
                        <span class="text-[10px] text-cyan-300 font-bold bg-slate-950/80 px-1 rounded">👁️ OJOS AQUÍ</span>
                        <span class="text-[10px] text-cyan-300 font-bold bg-slate-950/80 px-1 rounded">👁️</span>
                    </div>
                </div>
            </div>
        </div>

        <p id="estadoCamara" class="text-xs sm:text-sm text-amber-400 font-semibold mt-3 text-center">
            ⚠️ Alinee sus ojos con la línea punteada y su rostro dentro del óvalo
        </p>

        <!-- BOTONES DE CONTROL -->
        <div class="flex gap-3 w-full mt-4">
            <button type="button" onclick="window.close()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition-all shadow cursor-pointer">
                ❌ Cancelar
            </button>
            <button type="button" onclick="capturarFoto()" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                📸 Capturar Foto
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-slate-500 mt-2">
        © 2026 CEMG Juan Lindo — Sistema de Matrícula
    </footer>

    <!-- SCRIPT DE LA CÁMARA Y POSTMESSAGE -->
    <script>
        const video = document.getElementById("videoCamara");
        const canvas = document.getElementById("canvasFoto");

        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara. Verifique los permisos del navegador.");
            }
        }

        function capturarFoto() {
            if (!video.srcObject) {
                alert("La cámara no está activa.");
                return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");

            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const fotoBase64 = canvas.toDataURL("image/jpeg", 0.90);

            if (window.opener) {
                window.opener.postMessage({ 
                    tipo: "FOTO_CAPTURADA", 
                    foto: fotoBase64 
                }, "*");
                window.close();
            } else {
                alert("No se encontró la ventana principal para enviar la fotografía.");
            }
        }

        window.addEventListener("load", iniciarCamara);
    </script>
</body>
</html>
