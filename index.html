<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Carnet - CEMG Juan Lindo</title>
    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        /* Visor amplio y cómodo (460px x 610px) para máxima visibilidad */
        .visor-container {
            position: relative;
            width: 460px;
            height: 610px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #f59e0b;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.35);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo */
        }

        /* Guías proporcionales al nuevo tamaño del visor */
        .guia-carnet {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: 2px dashed rgba(254, 240, 138, 0.4);
            border-radius: 12px;
        }

        .oval-rostro {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 310px;
            border: 2px dashed rgba(52, 211, 153, 0.85);
            border-radius: 50%;
        }

        .silueta-hombros {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 150px;
            border-top: 2px dashed rgba(52, 211, 153, 0.85);
            border-radius: 50% 50% 0 0;
        }

        .btn-captura {
            margin-top: 18px;
            background: #f59e0b;
            color: #020617;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
        }

        .btn-captura:hover {
            background: #fbbf24;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h3 style="margin: 0 0 5px 0; color: #fef08a; font-size: 1.3rem;">📷 Encuadre Carnet Oficial</h3>
    <p style="margin: 0 0 15px 0; color: #94a3b8; font-size: 0.9rem;">Alinee la cabeza y hombros dentro de las guías verdes</p>

    <div class="visor-container">
        <video id="videoWebcam" autoplay playsinline></video>
        <div class="guia-carnet">
            <div class="oval-rostro"></div>
            <div class="silueta-hombros"></div>
        </div>
    </div>

    <button class="btn-captura" onclick="capturarFoto()">📸 Tomar Fotografía</button>

    <script>
        const video = document.getElementById('videoWebcam');

        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user"
            }, 
            audio: false 
        }).then(stream => {
            video.srcObject = stream;
        }).catch(err => {
            alert("No se pudo acceder a la cámara.");
        });

        function capturarFoto() {
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;
            let sx, sy, sWidth, sHeight;

            if (videoRatio > canvasRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * canvasRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / canvasRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }

            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.95);

            if (window.opener) {
                window.opener.postMessage(fotoBase64, "*");
                window.close();
            }
        }
    </script>
</body>
</html>
