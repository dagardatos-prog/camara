<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Carnet - CEMG Juan Lindo</title>
    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-h: 100vh;
            margin: 0;
            padding: 10px;
        }

        /* Contenedor con relación de aspecto carnet 3:4 */
        .visor-container {
            position: relative;
            width: 320px;
            height: 426px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
            background: #000;
        }

        /* El video se recorta automáticamente para enfoque de busto */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo para comodidad al posar */
        }

        /* Guía gráfica en pantalla para centrar rostro y hombros */
        .guia-carnet {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-border;
            border: 2px dashed rgba(254, 240, 138, 0.6);
            border-radius: 12px;
        }

        .oval-rostro {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 210px;
            border: 2px dashed rgba(52, 211, 153, 0.8);
            border-radius: 50%;
        }

        .silueta-hombros {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 100px;
            border-top: 2px dashed rgba(52, 211, 153, 0.8);
            border-radius: 50% 50% 0 0;
        }

        .btn-captura {
            margin-top: 15px;
            background: #f59e0b;
            color: #020617;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
        }

        .btn-captura:hover {
            background: #fbbf24;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h3 style="margin: 0 0 10px 0; color: #fef08a; font-size: 1.1rem;">📷 Encuadre Carnet Oficial</h3>
    <p style="margin: 0 0 15px 0; color: #94a3b8; font-size: 0.8rem;">Alinee la cabeza y hombros dentro de las guías</p>

    <div class="visor-container">
        <video id="videoWebcam" autoplay playsinline></video>
        <div class="guia-carnet">
            <div class="oval-rostro"></div>
            <div class="silueta-hombros"></div>
        </div>
    </div>

    <button class="btn-captura" onclick="capturarFoto()">📸 Tomar Fotografía</button>

    <script>
        const video = document.getElementById('videoWebcam');

        // Iniciar cámara web nativa sin filtros
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user"
            }, 
            audio: false 
        }).then(stream => {
            video.srcObject = stream;
        }).catch(err => {
            alert("No se pudo acceder a la cámara.");
        });

        function capturarFoto() {
            const canvas = document.createElement('canvas');
            // Proporción 3:4 limpia para fotografía carnet
            canvas.width = 480;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            // Invertir canvas para que la foto capturada coincida con el espejo
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            // Dibujar con recorte proporcional central sin estirar
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;
            let sx, sy, sWidth, sHeight;

            if (videoRatio > canvasRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * canvasRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / canvasRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }

            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            // Obtener foto en alta fidelidad y enviar al módulo de matrícula
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.95);

            if (window.opener) {
                window.opener.postMessage(fotoBase64, "*");
                window.close();
            }
        }
    </script>
</body>
</html>
